[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-infer"
version = "0.1.0"
description = "A small, executable guide to modern LLM inference engines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mini-infer contributors" }]
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.6"]
all = ["torch>=2.2", "pytest>=8", "ruff>=0.6"]

[project.scripts]
mini-infer = "mini_infer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

